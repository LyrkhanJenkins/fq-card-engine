stages:
  - build
  - test
  - lint
  - release

image: node:20

variables:
  RELEASE_DIR: "fq-card-engine" # Répertoire pour stocker les artefacts de release

build:
  stage: build
  script:
    - echo "Compiling the code..."
    - npm install
    - npm run build
    - echo "Compile complete."
  artifacts:
    untracked: true

test:
  stage: test
  script:
    - echo "Running tests..."
    - npm install
    - npm test
    - echo "Tests complete."

lint:
  stage: lint
  script:
    - echo "Running ESLint..."
    - npm install
    - npm run lint
    - echo "ESLint complete."

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  only:
    - tags
  dependencies:
    - build
  script:
    - apk update
    - apk add zip
    - rm -rf node_modules .git tests examples utils doc .babelrc .gitignore .gitlab-ci.yml package.json package-lock.json
    - echo "Releasing the tag..."
    - zip -r $RELEASE_DIR.zip * # Création de l'archive ZIP
    - ls -lrt
  artifacts:
    paths:
      - $RELEASE_DIR.zip
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Created using the release-cli $EXTRA_DESCRIPTION'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: "fq-card-engine.zip"
          url: "https://gitlab.com/final-quest/fq-card-engine/-/jobs/$CI_JOB_ID/artifacts/raw/fq-card-engine.zip"
